<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>{% block title %}DAVD Consulting{% endblock %}</title>
    <!-- Dynamic Flask route targeting static asset folder -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="container navbar-container">
        <a
          href="{{ url_for('index') }}"
          class="logo"
          >DAVD<span>Consulting</span></a
        >
        <nav class="nav-links">
          <a href="{{ url_for('index') }}">Home</a>
          <a href="{{ url_for('services') }}">Services</a>
          <a href="{{ url_for('contact') }}">Contact</a>
        </nav>
      </div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 DAVD Consulting. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
